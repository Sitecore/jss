name: Build and Test

on:
  push:
    branches:
      - master
      - dev
      - 'release/**'
    paths:
      - '**'
  pull_request:
    branches:
      - master
      - dev
      - 'release/**'
    paths:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      should-publish: ${{ steps.set-vars.outputs.should_publish }}
      branch-name: ${{ steps.set-vars.outputs.branch_name }}
      lerna-since-flag: ${{ steps.set-vars.outputs.lerna_since_flag }}
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.ref }}

      - name: Set branch context variables
        id: set-vars
        run: |
          BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

          if [[ "$BRANCH_NAME" == "dev" || "$BRANCH_NAME" == release/* ]]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
          else
            echo "should_publish=false" >> $GITHUB_OUTPUT
          fi

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "lerna_since_flag=--since=origin/dev" >> $GITHUB_OUTPUT
          else
            echo "lerna_since_flag=" >> $GITHUB_OUTPUT
          fi

      - name: Use Node.js 22
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Show variables
        run: |
          echo "branch_name=${{ steps.set-vars.outputs.branch_name }}"
          echo "should_publish=${{ steps.set-vars.outputs.should_publish }}"
          echo "lerna_since_flag=${{ steps.set-vars.outputs.lerna_since_flag }}"

      - name: Setup .NET Core # Required to execute ReportGenerator
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
          dotnet-quality: 'ga'

      - name: Yarn install (initial)
        run: |
          yarn cache clean --all
          yarn install --immutable

      - name: Lint packages
        run: |
          yarn lint-packages ${{ steps.set-vars.outputs.lerna_since_flag }}

      - name: Build packages
        run: npm run build

      - name: Run tests and collect coverage
        run: yarn coverage-packages
        env:
          testEnv: ci

      - name: Generate code coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@v5
        with:
          reports: '**/cobertura-coverage.xml'
          targetdir: './coverlet'
          reporttypes: 'HtmlInline_AzurePipelines;Cobertura'

      - name: Upload code coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverlet

      - name: Scaffold samples
        if: ${{ steps.set-vars.outputs.should_publish != 'true' }}
        run: yarn scaffold-samples

      - name: Yarn install (refresh)
        if: ${{ steps.set-vars.outputs.should_publish != 'true' }}
        run: yarn install

      - name: Lint samples
        if: ${{ steps.set-vars.outputs.should_publish != 'true' }}
        run: yarn lint-samples ${{ steps.set-vars.outputs.lerna_since_flag }}

      - name: Git configuration for publishing
        if: ${{ steps.set-vars.outputs.should_publish == 'true' }}
        run: |
          git config user.email builds@sitecore.com
          git config user.name "Automated Build"
          git remote set-url origin https://$GITHUB_PAT_ENV@github.com/${{ github.repository }}
          git checkout ${{ github.head_ref || github.ref_name }}
        env:
          GITHUB_PAT_ENV: ${{ secrets.GITHUB_PAT }}

      - name: Generate API docs
        if: ${{ steps.set-vars.outputs.should_publish == 'true' }}
        run: |
          yarn generate-docs
          git add ./ref-docs/**/*
          git commit -m "Update API docs [skip ci]"

      - name: Pre-release version update
        if: ${{ steps.set-vars.outputs.should_publish == 'true' }}
        run: |
          npm exec -- lerna version prerelease --exact --preid canary --force-publish --message "version %s [skip ci]" --yes

      - name: Pre-release canary publish
        if: ${{ steps.set-vars.outputs.should_publish == 'true' }}
        run: |
          echo //registry.npmjs.org/:_authToken=${NPM_TOKEN} > .npmrc
          npm exec -- lerna publish from-git --exact --canary --pre-dist-tag canary --preid canary --no-verify-access --yes
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
